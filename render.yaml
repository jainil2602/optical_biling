services:
  - type: web
    name: optical-billing
    runtime: python

    buildCommand: "bash build.sh"

    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: optical-billing-db
          property: connectionString

databases:
  - name: optical-billing-db